const randomStrings = function(){
  let sentence;
  const dictionary = ["best series", "Great series", "osm Series", "world no1 js series", "js king series"];
  let randomPic = Math.floor(Math.random() * 5);
  
    sentence = dictionary[randomPic];

  return sentence;
}

const h1 = document.querySelector('h1');

let intervalId;
const changeSentence = function(){
  if(intervalId == null){
     intervalId = setInterval(changeHeading,1000);

  }
 
  function changeHeading(){
    h1.innerHTML = randomStrings();
  }
}

const stopChangingSentence = function(){
  clearInterval(intervalId);
  intervalId = null;
}


document.querySelector('#start').addEventListener('click', changeSentence, false);
document.querySelector('#stop').addEventListener('click', stopChangingSentence, false);


</script>
